name: Build and verify Windows packages

on:
  workflow_call:
    inputs:
      sign-mode:
        type: string
        default: "Test Sign"
      upload-tag:
        type: string
        default: "build_github_ci_test_sign"

env:
  WINDOWS_SDK: 10.0.26100.0

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, platform: x64, compiler: amd64 }
          - { arch: arm64, platform: ARM64, compiler: arm64 }
    env:
      PLATFORM: ${{ matrix.platform }}
      ARCH: ${{ matrix.arch }}
      SIGN_MODE: ${{ inputs.sign-mode }}
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
        with:
          msbuild-architecture: x64

      - name: Build driver and controller
        run: |
          $props = @('/p:Configuration=Release', "/p:Platform=$env:PLATFORM", '/p:TargetVersion=Windows10',
                     "/p:WindowsTargetPlatformVersion=$env:WINDOWS_SDK")
          $mode = if ($env:SIGN_MODE -eq 'Test Sign') { 'TestSign' } else { $env:SIGN_MODE }
          $driverProps = $props + "/p:SignMode=$mode"
          msbuild RustDeskIddDriver/RustDeskIddDriver.vcxproj @driverProps
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          msbuild RustDeskIddApp/RustDeskIddApp.vcxproj @props

      - name: Compile driver tests for the target architecture
        run: |
          $install = vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          & "$install/Common7/Tools/Launch-VsDevShell.ps1" -Arch ${{ matrix.compiler }} -HostArch amd64 -SkipAutomaticLocation
          & ./tests/run-driver-tests.ps1 -SdkVersion $env:WINDOWS_SDK -BuildOnly
          New-Item -ItemType Directory bundle | Out-Null
          Copy-Item "tests/build/$env:ARCH/iddcx-1.10/driver_profiles.exe" bundle
          $env:VCToolsVersion.Trim() | Set-Content bundle/compiler.txt

      - name: Package driver and controller
        run: |
          $driver = "RustDeskIddDriver/$env:PLATFORM/Release"
          $stage = New-Item -ItemType Directory "RustDeskIddDriver_$env:ARCH"
          Copy-Item "$driver/RustDeskIddDriver" $stage -Recurse
          if ($env:SIGN_MODE -eq 'Test Sign') { Copy-Item "$driver/RustDeskIddDriver.cer" $stage }
          Copy-Item "RustDeskIddApp/$env:PLATFORM/Release/RustDeskIddApp.exe", 'RustDeskIddApp/README.md' $stage
          $runtime = "vc_redist.$env:ARCH.exe"
          Invoke-WebRequest "https://aka.ms/vs/17/release/$runtime" -OutFile (Join-Path $stage $runtime)
          $zip = "$($stage.Name).zip"
          Compress-Archive -Path "$stage/*" -DestinationPath "bundle/$zip"
          foreach ($algorithm in 'MD5', 'SHA256') {
            $digest = (Get-FileHash "bundle/$zip" -Algorithm $algorithm).Hash.ToLowerInvariant()
            "$digest  $zip" | Set-Content "bundle/$zip.checksum_$($algorithm.ToLowerInvariant())" -Encoding ascii
          }

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.upload-tag }}-${{ matrix.arch }}
          path: bundle/
          if-no-files-found: error

  verify:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64, runner: windows-2022 }
          - { arch: arm64, runner: windows-11-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.upload-tag }}-${{ matrix.arch }}
          path: bundle
      - name: Run packaged controller and driver tests natively
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if ($env:RUNNER_ARCH -ne $env:ARCH) { throw "Expected $env:ARCH runner, got $env:RUNNER_ARCH" }
          $toolset = (Get-Content -Raw bundle/compiler.txt).Trim()
          python tests/release_package.py "bundle/RustDeskIddDriver_$env:ARCH.zip" $env:ARCH $toolset --driver-tests bundle/driver_profiles.exe

  publish:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.upload-tag }}-*
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          tag_name: ${{ inputs.upload-tag }}
          fail_on_unmatched_files: true
          files: artifacts/*/RustDeskIddDriver_*.zip*
