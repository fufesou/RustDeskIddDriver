name: Build driver and test app

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-sign-off:
    permissions:
      contents: write
    uses: ./.github/workflows/msbuild.yml
    with:
      sign-mode: "off"
      upload-tag: "build_github_ci_sign_off"

  build-test-sign:
    permissions:
      contents: write
    uses: ./.github/workflows/msbuild.yml
    with:
      sign-mode: "Test Sign"
      upload-tag: "build_github_ci_test_sign"
